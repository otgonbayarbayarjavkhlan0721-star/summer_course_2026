<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Positioning дасгал - Badge, Navbar, Overlay</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            padding: 56px;
            /* TODO 1-ийн үргэлжлэл: navbar-ийг fixed болгоход контентын эхлэл
         далд орно. body-д padding-top: 56px нэмж засаарай. */
        }

        /* ===== 1-Р ХЭСЭГ: ТОГТМОЛ NAVBAR (fixed) ===== */
        /* TODO 1: .navbar-ийг дэлгэцийн дээд хэсэгт тогтмол байрлуул
       - Скролл хийхэд контентын ДЭЭР харагдах ёстой */
        .navbar {
            background-color: #1e293b;
            color: #ffffff;
            padding: 16px 24px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            width: 100%;


        }

        /* ===== 2-Р ХЭСЭГ: НААЛДАМХАЙ ГАРЧИГ (sticky) ===== */
        /* TODO 2: .section-title-ийг скролл хийхэд navbar-ийн доор
       наалддаг болго.
       - Контентын дээр харагдана  */
        .section-title {
            background-color: #e2e8f0;
            padding: 12px 24px;
            margin: 0;
            top: 0;
            position: sticky;
            top: 60px;
            z-index: 10;
            border-radius: 5px;

        }

        /* ===== 3-Р ХЭСЭГ: КАРТ ДЭЭРХ BADGE (relative + absolute) ===== */
        .card-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 24px;
        }

        /* TODO 3: .card-ийг badge-ийн ЖИШИГ ЦЭГ болго.
       */
        .card {
            flex: 1;
            min-width: 200px;
            background-color: #ffffff;
            padding: 16px;
            border-radius: 8px;
            position: relative;


        }

        /* TODO 4: .badge-ийг картын баруун дээд буланд байрлуул.
       - position: absolute
       
       - Дэвсгэр өнгө: #dc2626, үсгийн өнгө: #ffffff
        */
        .badge {
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 6px;
            background-color: #dc2626;
            color: #fff;
            border-radius: 3px;

        }

        /* ===== 4-Р ХЭСЭГ: ЗУРАГ ДЭЭРХ OVERLAY ===== */
        /* TODO 5: .screenshot-ийг overlay-ийн жишиг цэг болго
      */
        .screenshot {
            height: 180px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin-top: 12px;
            position: relative;
           

        }

        /* TODO 6: .overlay-ийг зургийн ДООД хэсгийг бүрхүүл.
   
       - Дэвсгэр өнгө: rgba(0, 0, 0, 0.6)
       - Үсгийн өнгө: #ffffff
       */
        .overlay {
            font-size: 14px;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 8px;

        }

        /* Урт хуудас үүсгэж скроллыг шалгах зориулалттай */
        .filler {
            height: 600px;
            padding: 24px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <nav class="navbar">GameShop — Тэргүүлэгчид</nav>

    <h2 class="section-title">Шинэ тоглоомууд</h2>

    <div class="card-row">
        <div class="card">
            <span class="badge">ШИНЭ</span>
            <h3>Могой</h3>
            <p>Сонгодог могой тоглоом.</p>
            <div class="screenshot">
                <div class="overlay">Дээд оноо: 9800 — Бат-Эрдэнэ</div>
            </div>
        </div>
        <div class="card">
            <span class="badge">-50%</span>
            <h3>Сансрын буудлага</h3>
            <p>Галактикаа хамгаал.</p>
            <div class="screenshot">
                <div class="overlay">Дээд оноо: 8700 — Сарнай</div>
            </div>
        </div>
    </div>

    <div class="filler">
        Доош скролл хийж navbar тогтмол, гарчиг наалдамхай эсэхийг шалгаарай.
    </div>

</body>

</html>
